<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0c0f" />
  <title>SharpEdge Sports Picks</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="logo">S</div><div><strong>SharpEdge</strong><span>Sports Intelligence</span></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="side-footer"><span class="status-dot"></span><span id="apiStatus">Checking data feed…</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">Today’s Edge</h1><p id="pageSubtitle">High-confidence picks across every major market.</p></div>
        <div class="top-actions"><button id="refreshBtn" class="btn ghost">Refresh</button><button id="proBtn" class="btn gold">Go Pro</button></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
